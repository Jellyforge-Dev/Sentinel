<!doctype html>
<html>
<head>
    <title>Sentinel</title>
</head>
<body>
    <div id="SentinelConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div class="sentinelPageHeader">
                    <h1 id="sentinelUiTitle">Jellyfin Sentinel</h1>
                    <p id="sentinelUiIntro">Incidents Sentinel has detected, grouped by media, client, and device. Click a card to see the evidence behind it.</p>
                </div>
                <form id="SentinelConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="SentinelLanguage" id="sentinelLanguageLabel">Language</label>
                        <select is="emby-select" id="SentinelLanguage" name="SentinelLanguage" class="emby-select-withcolor emby-select">
                            <option value="0">English</option>
                            <option value="1">Deutsch</option>
                            <option value="2">Español</option>
                            <option value="3">Français</option>
                            <option value="4">Svenska</option>
                            <option value="5">Dansk</option>
                            <option value="6">Polski</option>
                        </select>
                    </div>

                    <details class="sentinelSettingsDetails">
                        <summary id="sentinelNotificationChannelsHeader">Notification Channels</summary>
                        <div class="sentinelSettingsBody">
                            <div class="sentinelChannelGrid">
                                <div class="sentinelChannelCard sentinelChannelWebhook">
                                    <h3>Webhook</h3>
                                    <label class="checkboxContainer">
                                        <input is="emby-checkbox" type="checkbox" id="WebhookEnabled" />
                                        <span class="sentinelEnableLabel">Enable</span>
                                    </label>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="WebhookUrl" id="sentinelWebhookUrlLabel">Webhook URL</label>
                                        <input is="emby-input" type="text" id="WebhookUrl" />
                                    </div>
                                    <div class="selectContainer">
                                        <label class="selectLabel sentinelMinSeverityLabel" for="WebhookMinSeverity">Minimum Severity</label>
                                        <select is="emby-select" id="WebhookMinSeverity" class="emby-select-withcolor emby-select">
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                        </select>
                                    </div>
                                    <div class="sentinelChannelFooter">
                                        <button is="emby-button" type="button" class="raised sentinelTestButton" data-sentinel-test-channel="webhook">Send Test</button>
                                        <span class="sentinelTestResult" data-sentinel-test-result="webhook"></span>
                                    </div>
                                </div>

                                <div class="sentinelChannelCard sentinelChannelDiscord">
                                    <h3>Discord</h3>
                                    <label class="checkboxContainer">
                                        <input is="emby-checkbox" type="checkbox" id="DiscordEnabled" />
                                        <span class="sentinelEnableLabel">Enable</span>
                                    </label>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="DiscordWebhookUrl" id="sentinelDiscordWebhookUrlLabel">Discord Webhook URL</label>
                                        <input is="emby-input" type="text" id="DiscordWebhookUrl" />
                                    </div>
                                    <div class="selectContainer">
                                        <label class="selectLabel sentinelMinSeverityLabel" for="DiscordMinSeverity">Minimum Severity</label>
                                        <select is="emby-select" id="DiscordMinSeverity" class="emby-select-withcolor emby-select">
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                        </select>
                                    </div>
                                    <div class="sentinelChannelFooter">
                                        <button is="emby-button" type="button" class="raised sentinelTestButton" data-sentinel-test-channel="discord">Send Test</button>
                                        <span class="sentinelTestResult" data-sentinel-test-result="discord"></span>
                                    </div>
                                </div>

                                <div class="sentinelChannelCard sentinelChannelTelegram">
                                    <h3>Telegram</h3>
                                    <label class="checkboxContainer">
                                        <input is="emby-checkbox" type="checkbox" id="TelegramEnabled" />
                                        <span class="sentinelEnableLabel">Enable</span>
                                    </label>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="TelegramBotToken" id="sentinelTelegramBotTokenLabel">Bot Token</label>
                                        <input is="emby-input" type="text" id="TelegramBotToken" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="TelegramChatId" id="sentinelTelegramChatIdLabel">Chat ID</label>
                                        <input is="emby-input" type="text" id="TelegramChatId" />
                                    </div>
                                    <div class="selectContainer">
                                        <label class="selectLabel sentinelMinSeverityLabel" for="TelegramMinSeverity">Minimum Severity</label>
                                        <select is="emby-select" id="TelegramMinSeverity" class="emby-select-withcolor emby-select">
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                        </select>
                                    </div>
                                    <div class="sentinelChannelFooter">
                                        <button is="emby-button" type="button" class="raised sentinelTestButton" data-sentinel-test-channel="telegram">Send Test</button>
                                        <span class="sentinelTestResult" data-sentinel-test-result="telegram"></span>
                                    </div>
                                </div>

                                <div class="sentinelChannelCard sentinelChannelEmail">
                                    <h3>Email</h3>
                                    <label class="checkboxContainer">
                                        <input is="emby-checkbox" type="checkbox" id="EmailEnabled" />
                                        <span class="sentinelEnableLabel">Enable</span>
                                    </label>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailSmtpHost" id="sentinelEmailSmtpHostLabel">SMTP Host</label>
                                        <input is="emby-input" type="text" id="EmailSmtpHost" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailSmtpPort" id="sentinelEmailSmtpPortLabel">SMTP Port</label>
                                        <input is="emby-input" type="number" id="EmailSmtpPort" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailSmtpUsername" id="sentinelEmailSmtpUsernameLabel">SMTP Username</label>
                                        <input is="emby-input" type="text" id="EmailSmtpUsername" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailSmtpPassword" id="sentinelEmailSmtpPasswordLabel">SMTP Password</label>
                                        <input is="emby-input" type="password" id="EmailSmtpPassword" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailFromAddress" id="sentinelEmailFromAddressLabel">From Address</label>
                                        <input is="emby-input" type="text" id="EmailFromAddress" />
                                    </div>
                                    <div class="inputContainer">
                                        <label class="inputLabel inputLabelUnfocused" for="EmailToAddress" id="sentinelEmailToAddressLabel">To Address</label>
                                        <input is="emby-input" type="text" id="EmailToAddress" />
                                    </div>
                                    <div class="selectContainer">
                                        <label class="selectLabel sentinelMinSeverityLabel" for="EmailMinSeverity">Minimum Severity</label>
                                        <select is="emby-select" id="EmailMinSeverity" class="emby-select-withcolor emby-select">
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                        </select>
                                    </div>
                                    <div class="sentinelChannelFooter">
                                        <button is="emby-button" type="button" class="raised sentinelTestButton" data-sentinel-test-channel="email">Send Test</button>
                                        <span class="sentinelTestResult" data-sentinel-test-result="email"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </details>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span id="sentinelSaveButtonLabel">Save</span>
                        </button>
                    </div>
                </form>
                <style>
                    #SentinelConfigPage {
                        --sentinel-radius: 10px;
                        --sentinel-gap-sm: 0.5em;
                        --sentinel-gap-md: 0.75em;
                        --sentinel-gap-lg: 1.5em;
                        --sentinel-border: rgba(127, 127, 127, 0.25);
                        --sentinel-surface: rgba(127, 127, 127, 0.08);
                        --sentinel-surface-strong: rgba(127, 127, 127, 0.14);
                    }
                    .sentinelPageHeader {
                        margin-bottom: var(--sentinel-gap-lg);
                    }
                    .sentinelPageHeader p {
                        opacity: 0.75;
                        margin-top: 0.25em;
                    }
                    .sentinelSettingsDetails {
                        margin: 0 0 var(--sentinel-gap-lg);
                        border: 1px solid var(--sentinel-border);
                        border-radius: var(--sentinel-radius);
                        background: var(--sentinel-surface);
                        overflow: hidden;
                    }
                    .sentinelSettingsDetails > summary {
                        cursor: pointer;
                        padding: var(--sentinel-gap-md) 1em;
                        font-weight: 600;
                        list-style: none;
                        display: flex;
                        align-items: center;
                        gap: 0.5em;
                        user-select: none;
                    }
                    .sentinelSettingsDetails > summary::-webkit-details-marker {
                        display: none;
                    }
                    .sentinelSettingsDetails > summary::before {
                        content: '▸';
                        display: inline-block;
                        transition: transform 0.15s ease;
                    }
                    .sentinelSettingsDetails[open] > summary::before {
                        transform: rotate(90deg);
                    }
                    .sentinelSettingsBody {
                        padding: 0 1em 1em;
                    }
                    .sentinelChannelGrid {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                        gap: var(--sentinel-gap-md);
                        margin-top: var(--sentinel-gap-md);
                    }
                    .sentinelChannelCard {
                        background: var(--sentinel-surface-strong);
                        border: 1px solid var(--sentinel-border);
                        border-left-width: 4px;
                        border-radius: var(--sentinel-radius);
                        padding: var(--sentinel-gap-md) 1em;
                    }
                    .sentinelChannelCard.sentinelChannelWebhook { border-left-color: #4a90d9; }
                    .sentinelChannelCard.sentinelChannelDiscord { border-left-color: #5865f2; }
                    .sentinelChannelCard.sentinelChannelTelegram { border-left-color: #229ed9; }
                    .sentinelChannelCard.sentinelChannelEmail { border-left-color: #e0a030; }
                    .sentinelChannelCard h3 {
                        margin-top: 0;
                        margin-bottom: var(--sentinel-gap-sm);
                        font-size: 1em;
                    }
                    .sentinelChannelFooter {
                        display: flex;
                        align-items: center;
                        gap: var(--sentinel-gap-sm);
                        margin-top: var(--sentinel-gap-md);
                        flex-wrap: wrap;
                    }
                    .sentinelTestResult {
                        font-size: 0.85em;
                    }
                    .sentinelTestResult.sentinelTestSuccess {
                        color: #4caf50;
                    }
                    .sentinelTestResult.sentinelTestFailure {
                        color: #e05252;
                    }
                    .sentinelIncidentCard {
                        background: var(--sentinel-surface);
                        border: 1px solid var(--sentinel-border);
                        border-left-width: 4px;
                        border-radius: var(--sentinel-radius);
                        padding: var(--sentinel-gap-md) 1em;
                        margin-bottom: var(--sentinel-gap-md);
                        cursor: pointer;
                        transition: box-shadow 0.15s ease, transform 0.15s ease;
                    }
                    .sentinelIncidentCard:hover {
                        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                        transform: translateY(-1px);
                    }
                    .sentinelIncidentCard.sentinelStatusResolved {
                        opacity: 0.7;
                    }
                    .sentinelIncidentCard.sentinelStatusDetected { border-left-color: #4a90d9; }
                    .sentinelIncidentCard.sentinelStatusAcknowledged { border-left-color: #e0a030; }
                    .sentinelIncidentCard.sentinelStatusResolved { border-left-color: #4caf50; }
                    .sentinelIncidentCard.sentinelStatusReopened { border-left-color: #e05252; }
                    .sentinelIncidentHeader {
                        display: flex;
                        flex-wrap: wrap;
                        align-items: center;
                        gap: 0.75em;
                        justify-content: space-between;
                    }
                    .sentinelIncidentTitleGroup {
                        display: flex;
                        flex-wrap: wrap;
                        align-items: center;
                        gap: 0.5em;
                    }
                    .sentinelStatusBadge {
                        display: inline-block;
                        padding: 0.15em 0.6em;
                        border-radius: 999px;
                        font-size: 0.8em;
                        font-weight: 600;
                        text-transform: uppercase;
                        color: #fff;
                    }
                    .sentinelStatusBadge.sentinelStatusDetected { background: #4a90d9; }
                    .sentinelStatusBadge.sentinelStatusAcknowledged { background: #e0a030; }
                    .sentinelStatusBadge.sentinelStatusResolved { background: #4caf50; }
                    .sentinelStatusBadge.sentinelStatusReopened { background: #e05252; }
                    .sentinelStatusBadge.sentinelExceptedBadge { background: rgba(127, 127, 127, 0.4); }
                    .sentinelIncidentMedia { font-weight: 600; }
                    .sentinelIncidentOccurrences { opacity: 0.8; font-size: 0.9em; }
                    .sentinelIncidentMeta { opacity: 0.7; font-size: 0.85em; margin-top: 0.35em; }
                    .sentinelIncidentActions { margin-top: 0.6em; display: flex; gap: 0.5em; flex-wrap: wrap; }
                    .sentinelIncidentDetail {
                        margin-top: 0.75em;
                        padding-top: 0.6em;
                        border-top: 1px solid var(--sentinel-border);
                    }
                    .sentinelIncidentPlaceholder { opacity: 0.7; padding: 1em 0; }
                    .sentinelIncidentCard.sentinelExcepted { opacity: 0.75; }
                    .sentinelExpandHint {
                        opacity: 0.55;
                        font-size: 0.8em;
                        white-space: nowrap;
                        margin-left: auto;
                    }
                    .sentinelExpandChevron { display: inline-block; transition: transform 0.15s ease; }
                    .sentinelIncidentCard.sentinelExpanded .sentinelExpandChevron { transform: rotate(90deg); }
                    .sentinelNoteBlock { margin-top: 0.75em; }
                    .sentinelNoteInput {
                        width: 100%;
                        min-height: 4.5em;
                        box-sizing: border-box;
                        background: var(--sentinel-surface);
                        color: inherit;
                        border: 1px solid var(--sentinel-border);
                        border-radius: var(--sentinel-radius);
                        padding: 0.5em 0.75em;
                        font-family: inherit;
                        font-size: 0.9em;
                        resize: vertical;
                    }
                    .sentinelNoteFooter { display: flex; align-items: center; gap: 0.75em; margin-top: 0.5em; }
                    .sentinelFilterBar {
                        display: flex;
                        flex-wrap: wrap;
                        gap: var(--sentinel-gap-sm);
                        margin-bottom: var(--sentinel-gap-md);
                    }
                    .sentinelFilterTab {
                        background: var(--sentinel-surface);
                        /* Native <button> text does not inherit the page's text color by default
                           (unlike <span>/<div>), so without this it renders black-on-black against
                           Jellyfin's dark theme — this is what the "kaum lesbar" report was. */
                        color: inherit;
                        border: 1px solid var(--sentinel-border);
                        border-radius: 999px;
                        padding: 0.35em 0.9em;
                        font-size: 0.85em;
                        cursor: pointer;
                        transition: background 0.15s ease, border-color 0.15s ease;
                    }
                    .sentinelFilterTab:hover {
                        background: rgba(127, 127, 127, 0.16);
                    }
                    .sentinelFilterTab.sentinelFilterTabActive {
                        background: #4a90d9;
                        border-color: #4a90d9;
                        color: #fff;
                        font-weight: 600;
                    }
                    @media (max-width: 600px) {
                        .sentinelIncidentHeader { flex-direction: column; align-items: flex-start; }
                    }
                </style>
                <div id="sentinelFilterBar" class="sentinelFilterBar"></div>
                <div id="sentinelIncidentsContainer">
                    <div id="sentinelLoadingRow" class="sentinelIncidentPlaceholder">Loading…</div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                // jellyfin-web's view loader only keeps the div[data-role="page"] subtree when it
                // parses this file (Emby.Server plugin config pages are not full documents to the
                // SPA — everything outside this div, including a <script> placed as its sibling,
                // is silently discarded before it ever runs). This script must stay INSIDE
                // #SentinelConfigPage, matching the official jellyfin-plugin-template's own
                // configPage.html, or the page loads and does nothing.
                var SentinelConfig = {
                    pluginUniqueId: '4b5e3a79-7798-4066-841e-db7eb0125dc9'
                };

                // Populated from GET Sentinel/ui-strings once per pageshow. Every render function
                // below reads through getUiString() rather than this object directly, so the page
                // still shows sensible English text if that fetch hasn't resolved yet or fails.
                var uiStrings = {};
                var currentIncidents = [];
                var currentFilter = 'All';

                var FILTER_DEFINITIONS = [
                    { key: 'All', labelKey: 'UI_FILTER_ALL', match: function () { return true; } },
                    { key: 'Active', labelKey: 'UI_STATS_ACTIVE', match: function (incident) { return (incident.Status === 'Detected' || incident.Status === 'Reopened') && !incident.IsExcepted; } },
                    { key: 'Acknowledged', labelKey: 'UI_STATUS_ACKNOWLEDGED', match: function (incident) { return incident.Status === 'Acknowledged'; } },
                    { key: 'Resolved', labelKey: 'UI_STATUS_RESOLVED', match: function (incident) { return incident.Status === 'Resolved'; } },
                    { key: 'Expected', labelKey: 'UI_FILTER_EXPECTED', match: function (incident) { return incident.IsExcepted === true; } }
                ];
                var uiStringsDefaults = {
                    UI_TITLE: 'Jellyfin Sentinel',
                    UI_INTRO: 'Incidents Sentinel has detected, grouped by media, client, and device. Click a card to see the evidence behind it.',
                    UI_COL_TIME: 'Time',
                    UI_COL_MEDIA: 'Media',
                    UI_COL_CLIENT_DEVICE: 'Client / Device',
                    UI_COL_CONFIDENCE: 'Confidence',
                    UI_COL_EXPLANATION: 'Explanation',
                    UI_LOADING: 'Loading…',
                    UI_NO_DIAGNOSES: 'No diagnoses yet — Sentinel only records a diagnosis when a session actually transcoded for a reason its current rules recognize.',
                    UI_LOAD_FAILED: 'Failed to load diagnoses. Check Jellyfin\'s server log for details.',
                    UI_EVIDENCE_LABEL: 'Evidence:',
                    UI_RECOMMENDATION_LABEL: 'Recommendation:',
                    UI_CODE_LABEL: 'Code:',
                    UI_KNOWN_ISSUE_LABEL: 'Known Jellyfin Bug (not a Sentinel diagnosis):',
                    UI_COL_STATUS: 'Status',
                    UI_COL_OCCURRENCES: 'Occurrences',
                    UI_COL_FIRST_SEEN: 'First Seen',
                    UI_COL_LAST_SEEN: 'Last Seen',
                    UI_ACKNOWLEDGE_BUTTON: 'Acknowledge',
                    UI_RESOLVE_BUTTON: 'Resolve',
                    UI_STATUS_DETECTED: 'Detected',
                    UI_STATUS_ACKNOWLEDGED: 'Acknowledged',
                    UI_STATUS_RESOLVED: 'Resolved',
                    UI_STATUS_REOPENED: 'Reopened',
                    UI_NO_INCIDENTS: 'No incidents yet — Sentinel only records an incident when a session actually transcoded for a reason its current rules recognize.',
                    UI_LOAD_INCIDENTS_FAILED: 'Failed to load incidents. Check Jellyfin\'s server log for details.',
                    UI_COL_USER: 'User',
                    UI_STATS_TOTAL: 'Total',
                    UI_STATS_ACTIVE: 'Active',
                    UI_FILTER_ALL: 'All',
                    UI_NO_INCIDENTS_FOR_FILTER: 'No incidents match this filter.'
                };

                function getUiString(key) {
                    return uiStrings[key] || uiStringsDefaults[key];
                }

                var NOTIFICATION_TEXT_FIELD_IDS = [
                    'WebhookUrl', 'DiscordWebhookUrl',
                    'TelegramBotToken', 'TelegramChatId',
                    'EmailSmtpHost', 'EmailSmtpUsername', 'EmailSmtpPassword', 'EmailFromAddress', 'EmailToAddress',
                    'WebhookMinSeverity', 'DiscordMinSeverity', 'TelegramMinSeverity', 'EmailMinSeverity'
                ];
                var NOTIFICATION_BOOLEAN_FIELD_IDS = ['WebhookEnabled', 'DiscordEnabled', 'TelegramEnabled', 'EmailEnabled'];
                var NOTIFICATION_NUMBER_FIELD_IDS = ['EmailSmtpPort'];

                function loadNotificationSettings(config) {
                    NOTIFICATION_BOOLEAN_FIELD_IDS.forEach(function (fieldId) {
                        var element = document.querySelector('#' + fieldId);
                        if (element) {
                            element.checked = !!config[fieldId];
                        }
                    });

                    NOTIFICATION_TEXT_FIELD_IDS.concat(NOTIFICATION_NUMBER_FIELD_IDS).forEach(function (fieldId) {
                        var element = document.querySelector('#' + fieldId);
                        if (element) {
                            element.value = config[fieldId] != null ? String(config[fieldId]) : '';
                        }
                    });
                }

                function applyNotificationSettings(config) {
                    NOTIFICATION_BOOLEAN_FIELD_IDS.forEach(function (fieldId) {
                        var element = document.querySelector('#' + fieldId);
                        if (element) {
                            config[fieldId] = element.checked;
                        }
                    });

                    NOTIFICATION_TEXT_FIELD_IDS.forEach(function (fieldId) {
                        var element = document.querySelector('#' + fieldId);
                        if (element) {
                            config[fieldId] = element.value;
                        }
                    });

                    NOTIFICATION_NUMBER_FIELD_IDS.forEach(function (fieldId) {
                        var element = document.querySelector('#' + fieldId);
                        if (element) {
                            config[fieldId] = parseInt(element.value, 10) || 0;
                        }
                    });
                }

                // pageshow (see below) can fire more than once for the same DOM without a full
                // page reload — wiring unconditionally on every pageshow attached a fresh set of
                // click listeners on top of the old ones each time, so a single click sent as
                // many test notifications as pageshow had fired. Wired exactly once, ever.
                var testSendButtonsWired = false;

                function saveCurrentFormState() {
                    return ApiClient.getPluginConfiguration(SentinelConfig.pluginUniqueId).then(function (config) {
                        config.Language = parseInt(document.querySelector('#SentinelLanguage').value, 10);
                        applyNotificationSettings(config);
                        return ApiClient.updatePluginConfiguration(SentinelConfig.pluginUniqueId, config);
                    });
                }

                function wireTestSendButtons() {
                    if (testSendButtonsWired) {
                        return;
                    }

                    testSendButtonsWired = true;

                    document.querySelectorAll('[data-sentinel-test-channel]').forEach(function (button) {
                        button.addEventListener('click', function () {
                            var channelName = button.getAttribute('data-sentinel-test-channel');
                            var resultSpan = document.querySelector('[data-sentinel-test-result="' + channelName + '"]');

                            if (resultSpan) {
                                resultSpan.className = 'sentinelTestResult';
                                resultSpan.textContent = getUiString('UI_TEST_SAVING');
                            }

                            // Test must reflect whatever is currently typed in the form, not the
                            // last saved config — otherwise a field edited but not yet saved via
                            // the page's own Save button silently tests the OLD value.
                            saveCurrentFormState().then(function () {
                                if (resultSpan) {
                                    resultSpan.textContent = getUiString('UI_TEST_SENDING');
                                }

                                var url = ApiClient.getUrl('Sentinel/notifications/test/' + encodeURIComponent(channelName));
                                return ApiClient.ajax({ type: 'POST', url: url });
                            }).then(function () {
                                if (resultSpan) {
                                    resultSpan.className = 'sentinelTestResult sentinelTestSuccess';
                                    resultSpan.textContent = getUiString('UI_TEST_SUCCESS');
                                }
                            }).catch(function (err) {
                                if (!resultSpan) {
                                    return;
                                }

                                resultSpan.className = 'sentinelTestResult sentinelTestFailure';
                                resultSpan.textContent = getUiString('UI_TEST_FAILURE_GENERIC');

                                if (err && typeof err.json === 'function') {
                                    err.json().then(function (body) {
                                        if (body && body.Reason) {
                                            resultSpan.textContent = getUiString('UI_TEST_FAILURE_PREFIX') + ' ' + body.Reason;
                                        }
                                    }).catch(function () { /* body wasn't JSON — keep the generic message */ });
                                }
                            });
                        });
                    });
                }

                function escapeHtmlText(value) {
                    var div = document.createElement('div');
                    div.textContent = value === null || value === undefined ? '' : String(value);
                    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                }

                function applyUiStrings() {
                    document.querySelector('#sentinelUiTitle').textContent = getUiString('UI_TITLE');
                    document.querySelector('#sentinelUiIntro').textContent = getUiString('UI_INTRO');

                    // Only present until the first incidents fetch replaces the container's contents.
                    var loadingRow = document.querySelector('#sentinelLoadingRow');
                    if (loadingRow) {
                        loadingRow.textContent = getUiString('UI_LOADING');
                    }

                    document.querySelector('#sentinelLanguageLabel').textContent = getUiString('UI_LANGUAGE_LABEL');
                    document.querySelector('#sentinelNotificationChannelsHeader').textContent = getUiString('UI_NOTIFICATION_CHANNELS_HEADER');
                    document.querySelector('#sentinelSaveButtonLabel').textContent = getUiString('UI_SAVE_BUTTON');

                    document.querySelectorAll('.sentinelEnableLabel').forEach(function (el) {
                        el.textContent = getUiString('UI_ENABLE_LABEL');
                    });
                    document.querySelectorAll('.sentinelMinSeverityLabel').forEach(function (el) {
                        el.textContent = getUiString('UI_MIN_SEVERITY_LABEL');
                    });
                    document.querySelectorAll('.sentinelTestButton').forEach(function (el) {
                        el.textContent = getUiString('UI_SEND_TEST_BUTTON');
                    });
                    document.querySelectorAll('select[id$="MinSeverity"] option[value="low"]').forEach(function (el) {
                        el.textContent = getUiString('UI_SEVERITY_LOW');
                    });
                    document.querySelectorAll('select[id$="MinSeverity"] option[value="medium"]').forEach(function (el) {
                        el.textContent = getUiString('UI_SEVERITY_MEDIUM');
                    });
                    document.querySelectorAll('select[id$="MinSeverity"] option[value="high"]').forEach(function (el) {
                        el.textContent = getUiString('UI_SEVERITY_HIGH');
                    });

                    document.querySelector('#sentinelWebhookUrlLabel').textContent = getUiString('UI_WEBHOOK_URL_LABEL');
                    document.querySelector('#sentinelDiscordWebhookUrlLabel').textContent = getUiString('UI_DISCORD_WEBHOOK_URL_LABEL');
                    document.querySelector('#sentinelTelegramBotTokenLabel').textContent = getUiString('UI_TELEGRAM_BOT_TOKEN_LABEL');
                    document.querySelector('#sentinelTelegramChatIdLabel').textContent = getUiString('UI_TELEGRAM_CHAT_ID_LABEL');
                    document.querySelector('#sentinelEmailSmtpHostLabel').textContent = getUiString('UI_SMTP_HOST_LABEL');
                    document.querySelector('#sentinelEmailSmtpPortLabel').textContent = getUiString('UI_SMTP_PORT_LABEL');
                    document.querySelector('#sentinelEmailSmtpUsernameLabel').textContent = getUiString('UI_SMTP_USERNAME_LABEL');
                    document.querySelector('#sentinelEmailSmtpPasswordLabel').textContent = getUiString('UI_SMTP_PASSWORD_LABEL');
                    document.querySelector('#sentinelEmailFromAddressLabel').textContent = getUiString('UI_EMAIL_FROM_LABEL');
                    document.querySelector('#sentinelEmailToAddressLabel').textContent = getUiString('UI_EMAIL_TO_LABEL');
                }

                function loadUiStrings() {
                    var url = ApiClient.getUrl('Sentinel/ui-strings');

                    ApiClient.ajax({ type: 'GET', url: url, dataType: 'json' }).then(function (strings) {
                        uiStrings = strings || {};
                        applyUiStrings();
                    }).catch(function () {
                        // Leave uiStrings empty — getUiString() falls back to uiStringsDefaults,
                        // so the page keeps showing its English text instead of blank/undefined.
                    });
                }

                function buildEvidenceList(evidence) {
                    if (!evidence || evidence.length === 0) {
                        return '<li>(no evidence recorded)</li>';
                    }

                    return evidence.map(function (item) {
                        return '<li>' + escapeHtmlText(item) + '</li>';
                    }).join('');
                }

                var STATUS_BADGE_CLASS = {
                    Detected: 'sentinelStatusDetected',
                    Acknowledged: 'sentinelStatusAcknowledged',
                    Resolved: 'sentinelStatusResolved',
                    Reopened: 'sentinelStatusReopened'
                };

                function statusLabel(status) {
                    return getUiString('UI_STATUS_' + status.toUpperCase()) || status;
                }

                function buildKnownIssueBlock(incident) {
                    // The https:// check is defense in depth, not a currently-exploitable gap:
                    // today's only KnownIssueUrl values come from a hardcoded server-side table
                    // (KnownCoreIssues.cs), not user input. It guards against a future version of
                    // that table becoming configurable or remote-loaded ever allowing a
                    // javascript: URL to reach this href unnoticed.
                    if (!incident.KnownIssueUrl || !/^https:\/\//.test(incident.KnownIssueUrl)) {
                        return '';
                    }

                    // Deliberately labeled distinctly from Sentinel's own diagnosis — this is a
                    // curated pointer to an already-filed Jellyfin core bug, not something
                    // Sentinel itself inferred (master plan Section 14: "Known Jellyfin Bug",
                    // never presented as if it were a Sentinel diagnosis).
                    return '<div style="margin-top:0.5em;border-left:3px solid orange;padding-left:0.5em;">' +
                        '<strong>' + escapeHtmlText(getUiString('UI_KNOWN_ISSUE_LABEL')) + '</strong> ' +
                        escapeHtmlText(incident.KnownIssueExplanation) + ' ' +
                        '<a href="' + escapeHtmlText(incident.KnownIssueUrl) + '" target="_blank" rel="noopener noreferrer">' +
                        escapeHtmlText(incident.KnownIssueUrl) + '</a></div>';
                }

                function postIncidentAction(id, action, onDone) {
                    var url = ApiClient.getUrl('Sentinel/incidents/' + encodeURIComponent(id) + '/' + action);
                    ApiClient.ajax({ type: 'POST', url: url }).then(onDone).catch(onDone);
                }

                function buildIncidentCard(incident) {
                    // Property names below are PascalCase on purpose: Jellyfin's API serializes
                    // JSON with PascalCase property names by default (no camelCase conversion),
                    // matching the C# property names exactly — verified against Jellyfin's own
                    // JsonDefaults/PascalCaseJsonProfileFormatter and confirmed by how
                    // jellyfin-plugin-playbackreporting's own client-side JS reads its API
                    // responses (matching its controller's exact casing, not auto-camelCased).
                    var badgeClass = STATUS_BADGE_CLASS[incident.Status] || '';

                    var card = document.createElement('div');
                    card.className = 'sentinelIncidentCard ' + badgeClass + (incident.IsExcepted ? ' sentinelExcepted' : '');

                    var header = document.createElement('div');
                    header.className = 'sentinelIncidentHeader';
                    header.innerHTML =
                        '<div class="sentinelIncidentTitleGroup">' +
                        '<span class="sentinelStatusBadge ' + badgeClass + '">' + escapeHtmlText(statusLabel(incident.Status)) + '</span>' +
                        (incident.IsExcepted ? '<span class="sentinelStatusBadge sentinelExceptedBadge">' + escapeHtmlText(getUiString('UI_EXCEPTED_BADGE')) + '</span>' : '') +
                        '<span class="sentinelIncidentMedia">' + escapeHtmlText(incident.MediaName) + '</span>' +
                        '<span class="sentinelIncidentOccurrences">' + escapeHtmlText(getUiString('UI_COL_OCCURRENCES')) + ': ' + escapeHtmlText(incident.OccurrenceCount) + '</span>' +
                        '</div>' +
                        '<span class="sentinelExpandHint">' + escapeHtmlText(getUiString('UI_CLICK_FOR_DETAILS')) + ' <span class="sentinelExpandChevron">▸</span></span>';

                    var meta = document.createElement('div');
                    meta.className = 'sentinelIncidentMeta';
                    meta.textContent =
                        incident.Client + ' / ' + incident.DeviceName +
                        (incident.UserName ? ' · ' + getUiString('UI_COL_USER') + ': ' + incident.UserName : '') +
                        ' · ' + getUiString('UI_COL_FIRST_SEEN') + ': ' + new Date(incident.FirstSeenUtc).toLocaleString() +
                        ' · ' + getUiString('UI_COL_LAST_SEEN') + ': ' + new Date(incident.LastSeenUtc).toLocaleString() +
                        (incident.Confidence ? ' · ' + getUiString('UI_COL_CONFIDENCE') + ': ' + incident.Confidence : '');

                    var detail = document.createElement('div');
                    detail.className = 'sentinelIncidentDetail';
                    detail.style.display = 'none';
                    detail.innerHTML =
                        '<div>' + escapeHtmlText(incident.Explanation) + '</div>' +
                        '<strong>' + escapeHtmlText(getUiString('UI_EVIDENCE_LABEL')) + '</strong><ul>' + buildEvidenceList(incident.Evidence) + '</ul>' +
                        '<strong>' + escapeHtmlText(getUiString('UI_RECOMMENDATION_LABEL')) + '</strong> ' + escapeHtmlText(incident.Recommendation) +
                        '<div><em>' + escapeHtmlText(getUiString('UI_CODE_LABEL')) + ' ' + escapeHtmlText(incident.Code) + '</em></div>' +
                        buildKnownIssueBlock(incident);

                    var noteBlock = document.createElement('div');
                    noteBlock.className = 'sentinelNoteBlock';

                    var noteLabel = document.createElement('label');
                    noteLabel.className = 'inputLabel inputLabelUnfocused';
                    noteLabel.textContent = getUiString('UI_NOTE_LABEL');
                    noteBlock.appendChild(noteLabel);

                    var noteInput = document.createElement('textarea');
                    noteInput.className = 'sentinelNoteInput';
                    noteInput.placeholder = getUiString('UI_NOTE_PLACEHOLDER');
                    noteInput.value = incident.ResolutionNote || '';
                    noteInput.addEventListener('click', function (event) { event.stopPropagation(); });
                    noteBlock.appendChild(noteInput);

                    var noteFooter = document.createElement('div');
                    noteFooter.className = 'sentinelNoteFooter';

                    var noteSaveButton = document.createElement('button');
                    noteSaveButton.setAttribute('is', 'emby-button');
                    noteSaveButton.className = 'raised';
                    noteSaveButton.textContent = getUiString('UI_NOTE_SAVE_BUTTON');
                    var noteResult = document.createElement('span');
                    noteResult.className = 'sentinelTestResult';
                    noteSaveButton.addEventListener('click', function (event) {
                        event.stopPropagation();
                        var url = ApiClient.getUrl('Sentinel/incidents/' + encodeURIComponent(incident.Id) + '/note');
                        ApiClient.ajax({ type: 'POST', url: url, data: JSON.stringify({ Note: noteInput.value }), contentType: 'application/json' }).then(function () {
                            noteResult.className = 'sentinelTestResult sentinelTestSuccess';
                            noteResult.textContent = getUiString('UI_NOTE_SAVED');
                        }).catch(function () {
                            noteResult.className = 'sentinelTestResult sentinelTestFailure';
                            noteResult.textContent = getUiString('UI_LOAD_INCIDENTS_FAILED');
                        });
                    });
                    noteFooter.appendChild(noteSaveButton);
                    noteFooter.appendChild(noteResult);
                    noteBlock.appendChild(noteFooter);
                    detail.appendChild(noteBlock);

                    var actions = document.createElement('div');
                    actions.className = 'sentinelIncidentActions';

                    if (incident.Status === 'Detected' || incident.Status === 'Reopened') {
                        var acknowledgeButton = document.createElement('button');
                        acknowledgeButton.setAttribute('is', 'emby-button');
                        acknowledgeButton.className = 'raised';
                        acknowledgeButton.textContent = getUiString('UI_ACKNOWLEDGE_BUTTON');
                        acknowledgeButton.addEventListener('click', function (event) {
                            event.stopPropagation();
                            postIncidentAction(incident.Id, 'acknowledge', loadIncidents);
                        });
                        actions.appendChild(acknowledgeButton);
                    }

                    if (incident.Status !== 'Resolved') {
                        var resolveButton = document.createElement('button');
                        resolveButton.setAttribute('is', 'emby-button');
                        resolveButton.className = 'raised';
                        resolveButton.textContent = getUiString('UI_RESOLVE_BUTTON');
                        resolveButton.addEventListener('click', function (event) {
                            event.stopPropagation();
                            postIncidentAction(incident.Id, 'resolve', loadIncidents);
                        });
                        actions.appendChild(resolveButton);
                    }

                    var exceptionButton = document.createElement('button');
                    exceptionButton.setAttribute('is', 'emby-button');
                    exceptionButton.className = 'raised';
                    exceptionButton.textContent = incident.IsExcepted ? getUiString('UI_UNMARK_EXCEPTION_BUTTON') : getUiString('UI_MARK_EXCEPTION_BUTTON');
                    exceptionButton.addEventListener('click', function (event) {
                        event.stopPropagation();
                        postIncidentAction(incident.Id, incident.IsExcepted ? 'unexcept' : 'except', loadIncidents);
                    });
                    actions.appendChild(exceptionButton);

                    card.appendChild(header);
                    card.appendChild(meta);
                    card.appendChild(actions);
                    card.appendChild(detail);

                    card.addEventListener('click', function () {
                        var expanded = detail.style.display !== 'none';
                        detail.style.display = expanded ? 'none' : '';
                        card.classList.toggle('sentinelExpanded', !expanded);
                    });

                    return card;
                }

                function renderFilterBar() {
                    var bar = document.querySelector('#sentinelFilterBar');
                    bar.innerHTML = '';

                    FILTER_DEFINITIONS.forEach(function (definition) {
                        var count = currentIncidents.filter(definition.match).length;
                        var tab = document.createElement('button');
                        tab.type = 'button';
                        tab.className = 'sentinelFilterTab' + (currentFilter === definition.key ? ' sentinelFilterTabActive' : '');
                        tab.textContent = getUiString(definition.labelKey) + ' (' + count + ')';
                        tab.addEventListener('click', function () {
                            currentFilter = definition.key;
                            renderFilterBar();
                            renderIncidentCards();
                        });
                        bar.appendChild(tab);
                    });
                }

                function renderIncidentCards() {
                    var container = document.querySelector('#sentinelIncidentsContainer');
                    container.innerHTML = '';

                    if (currentIncidents.length === 0) {
                        var emptyState = document.createElement('div');
                        emptyState.className = 'sentinelIncidentPlaceholder';
                        emptyState.textContent = getUiString('UI_NO_INCIDENTS');
                        container.appendChild(emptyState);
                        return;
                    }

                    var activeDefinition = FILTER_DEFINITIONS.filter(function (d) { return d.key === currentFilter; })[0] || FILTER_DEFINITIONS[0];
                    var filtered = currentIncidents.filter(activeDefinition.match);

                    if (filtered.length === 0) {
                        var noMatchState = document.createElement('div');
                        noMatchState.className = 'sentinelIncidentPlaceholder';
                        noMatchState.textContent = getUiString('UI_NO_INCIDENTS_FOR_FILTER');
                        container.appendChild(noMatchState);
                        return;
                    }

                    filtered.forEach(function (incident) {
                        container.appendChild(buildIncidentCard(incident));
                    });
                }

                function loadIncidents() {
                    var url = ApiClient.getUrl('Sentinel/incidents');

                    ApiClient.ajax({ type: 'GET', url: url, dataType: 'json' }).then(function (incidents) {
                        currentIncidents = incidents || [];
                        renderFilterBar();
                        renderIncidentCards();
                    }).catch(function () {
                        var container = document.querySelector('#sentinelIncidentsContainer');
                        container.innerHTML = '';
                        var errorState = document.createElement('div');
                        errorState.className = 'sentinelIncidentPlaceholder';
                        errorState.textContent = getUiString('UI_LOAD_INCIDENTS_FAILED');
                        container.appendChild(errorState);
                    });
                }

                // SupportedLanguage's C# enum order (En, De, Es, Fr, Sv, Da, Pl) matches this
                // select's option values 0-6. Jellyfin's server JSON serializer may hand this back
                // as either the numeric value or the enum's name (e.g. "En") depending on server
                // version/config, so both are handled here — a plain String(config.Language) only
                // worked for the numeric case, leaving the select blank whenever the server sent a
                // name instead.
                var SUPPORTED_LANGUAGE_NAMES = ['En', 'De', 'Es', 'Fr', 'Sv', 'Da', 'Pl'];

                function resolveLanguageIndex(rawLanguage) {
                    if (typeof rawLanguage === 'number') {
                        return rawLanguage;
                    }

                    var index = SUPPORTED_LANGUAGE_NAMES.indexOf(rawLanguage);
                    return index >= 0 ? index : 0;
                }

                function loadLanguageSetting() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(SentinelConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#SentinelLanguage').value = String(resolveLanguageIndex(config.Language));
                        loadNotificationSettings(config);
                        Dashboard.hideLoadingMsg();
                    });
                }

                document.querySelector('#SentinelConfigPage').addEventListener('pageshow', function () {
                    loadUiStrings();
                    loadIncidents();
                    loadLanguageSetting();
                    wireTestSendButtons();
                });

                document.querySelector('#SentinelConfigForm').addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(SentinelConfig.pluginUniqueId).then(function (config) {
                        config.Language = parseInt(document.querySelector('#SentinelLanguage').value, 10);
                        applyNotificationSettings(config);
                        ApiClient.updatePluginConfiguration(SentinelConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
