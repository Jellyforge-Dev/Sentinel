overview: "Evidence-based root-cause diagnosis for Jellyfin playback problems"
description: >
  Sentinel watches Jellyfin playback sessions and explains, with evidence,
  why a specific transcode or playback problem happened — not just that
  it happened.
category: "General"
owner: "Jellyforge-Dev"
# NOTE on this list: JPRM's `package_plugin()` (jprm/__init__.py) copies exactly, and only,
# the files named below from the `dotnet publish` output into the release zip — for each
# entry it does `shutil.copyfile(os.path.join(binary_path, artifact), ...)`, preserving any
# subfolder structure in the entry's own path. Nothing outside this list is ever included,
# so this is a strict copy-filter, not just descriptive metadata about the package contents.
# Verified against `dotnet publish -c Release` output on 2026-09-18 (Microsoft.Data.Sqlite
# 10.0.12 / SQLitePCLRaw.provider.e_sqlite3 2.1.12, matching the PackageReference versions in
# the .csproj) — the
# managed assemblies below plus a `runtimes/<rid>/native/` folder are what the publish step
# actually produces. If the SQLite package version ever changes, re-run publish and re-check
# this list rather than assuming it's still accurate.
#
# MailKit (added for the Email notification channel) re-verified the same way on 2026-09-23
# (MailKit 4.18.0): ran `dotnet publish -c Release` twice — once with the MailKit
# PackageReference in place, once with it (and the code referencing it) temporarily removed —
# and diffed the two output file lists. MailKit brings in exactly three new managed files, no
# native/runtimes subfolder: MailKit.dll, MimeKit.dll, BouncyCastle.Cryptography.dll. Notably
# absent is System.Security.Cryptography.Pkcs.dll, which a throwaway console-project publish
# had suggested might also be new — in this project it's already supplied by the
# `<FrameworkReference Include="Microsoft.AspNetCore.App" />` above (part of the ASP.NET Core
# shared framework Jellyfin's host always provides), so it correctly does NOT appear as a new
# publish-output file here and must not be added to the artifact list below.
#
# Native runtime entries below are limited to Jellyfin's own officially supported server
# platforms (Windows x64/arm64, Linux x64/arm64, macOS x64/arm64) rather than every RID the
# publish step emits (it also produces linux-arm/armel/musl-*/mips64/ppc64le/riscv64/s390x,
# win-x86, maccatalyst-*, and browser-wasm variants, which are intentionally omitted as
# unsupported Jellyfin server platforms). This flat-file-per-RID convention, including for
# entries nested under `runtimes/`, matches other Jellyfin plugins that ship a native
# dependency (e.g. unfedorg/jellyfin-plugin-pdfcover's build.yaml lists
# `runtimes/<rid>/native/libpdfium.*` the same way).
#
# IMPORTANT — confirmed via a live-server install (2026-09-18): Jellyfin's own PluginManager
# (Emby.Server.Implementations.Plugins.PluginManager.TryGetPluginDlls) recursively globs every
# *.dll file anywhere under the plugin's folder and tries to load each one as a managed .NET
# assembly. The two Windows native SQLite libraries below are therefore packaged with a
# ".dll.win" extension, NOT ".dll" — a plain "e_sqlite3.dll" here gets picked up by that glob
# and crashes the whole plugin with a BadImageFormatException the instant Jellyfin tries to
# load it as managed code (real error: "Failed to load assembly
# .../runtimes/win-arm64/native/e_sqlite3.dll ... System.BadImageFormatException"). Linux
# (.so) and macOS (.dylib) files are unaffected by this glob and keep their normal extensions.
# Plugin.cs registers a NativeLibrary.SetDllImportResolver that knows to look for the renamed
# file on Windows — see the comment in its constructor. This exact ".dll.win" renaming
# technique is the one unfedorg/jellyfin-plugin-pdfcover uses for the identical problem with
# its own native dependency.
artifacts:
- "Jellyfin.Plugin.Sentinel.dll"
- "Microsoft.Data.Sqlite.dll"
- "SQLitePCLRaw.core.dll"
- "SQLitePCLRaw.batteries_v2.dll"
- "SQLitePCLRaw.provider.e_sqlite3.dll"
- "MailKit.dll"
- "MimeKit.dll"
- "BouncyCastle.Cryptography.dll"
- "runtimes/win-x64/native/e_sqlite3.dll.win"
- "runtimes/win-arm64/native/e_sqlite3.dll.win"
- "runtimes/linux-x64/native/libe_sqlite3.so"
- "runtimes/linux-arm64/native/libe_sqlite3.so"
- "runtimes/osx-x64/native/libe_sqlite3.dylib"
- "runtimes/osx-arm64/native/libe_sqlite3.dylib"
changelog: >
  0.1.5.1: Adds full localization (English, German, Spanish, French, Swedish, Danish, Polish) —
  a per-plugin Language setting, and every diagnosis explanation/recommendation plus every
  dashboard UI string is now translated at serve time via a new GET Sentinel/ui-strings endpoint.
  Fixes the dashboard's media display to show "Series - Episode Name" for TV episodes instead of
  just the episode name. Adds the Incident Engine: diagnoses sharing the same rule code, media
  item, client, and device are now deduplicated into a single Incident (via a partial unique
  SQLite index on that fingerprint) instead of alerting once per raw diagnosis; a resolved
  incident that recurs reopens instead of duplicating; new GET/POST Sentinel/incidents endpoints
  (list, acknowledge, resolve). The dashboard is rewritten from a plain diagnosis table into a
  card-based Incident view with status badges, occurrence counts, and working Acknowledge/Resolve
  buttons, plus a language selector wired to the new setting. Notification Delivery
  (Webhook/Discord/Telegram/Email), the plugin-update/restart-pending notification feature, and a
  dedicated security review are NOT yet in this release — tracked for a following one. Verified
  by a fresh-subagent review after every task (spec compliance + code quality, including
  independent re-runs of the full test suite and independent JSON-validity checks on all 7 locale
  files); not yet confirmed against a real Jellyfin server for any of this release's features.
  0.1.5.0: Adds five new diagnosis rules covering external audio tracks, HDR/dynamic-range
  mismatches, audio channel downmixing, bitrate-only transcodes, and resolution-only transcodes
  — including the exact real-world case confirmed on a live server in 0.1.4.0 (an AV1 transcode
  with only an audio-channel-downmix reason, previously unrecognized). Also wires up the
  previously dormant Known Core Issues table into the API and dashboard, surfaced as a distinct
  "Known Jellyfin Bug" note. Verified by three rounds of independent review; each rule's
  PlayMethod == Transcode gate and mutual exclusivity with stronger, more specific diagnoses is
  covered by a dedicated regression test, verified RED/GREEN by temporarily removing every gate
  and confirming each one is independently caught. Not yet confirmed against a real server for
  these specific new rules.
  0.1.4.0: Fixes a data-integrity bug confirmed on a real server running 0.1.3.0: a session with
  a verified, active ffmpeg transcode (video re-encoded, audio downmixed — confirmed via the
  server's own transcode log) still produced a PlaybackEvent row with PlayMethod = DirectPlay
  next to a correctly non-zero TranscodeReasons, silently suppressing the diagnosis despite the
  reasons having been captured correctly. PlaybackEventFactory now forces PlayMethod to
  Transcode when TranscodeReasons is non-default and PlayMethod resolved to DirectPlay or null
  (DirectStream/remux sessions are correctly left alone, since they legitimately carry
  non-zero TranscodeReasons too — a broader first version of this fix was caught and narrowed
  during review before release). Verified by two rounds of independent review plus a regression
  test reproducing the exact real-world contradiction; not yet re-confirmed against a real
  server for this specific fix.
  0.1.3.0: Fixes a bug affecting every previous version: Jellyfin always clears the play
  method and transcode-reason data on a session before firing the event this plugin used to
  read them from, so PlaybackEvent rows were recorded with an empty play method and zero
  transcode reasons regardless of whether a transcode actually happened — confirmed live with
  a real bitrate-driven transcode that produced a blank database row despite Jellyfin's own
  dashboard showing an active transcode with a specific reason. Sentinel now also listens to
  playback-progress events (while that data is still live) and caches it per playback,
  including a fallback for Jellyfin's own idle-timeout stop path, which never supplies the
  identifier this plugin would otherwise key on. Verified by three rounds of independent
  review plus targeted regression tests reproducing the exact real-world event sequence; not
  yet re-confirmed against a real server for this specific fix.
  0.1.2.0: Adds a minimal read-only dashboard to the plugin's configuration page — a table of
  recent diagnoses (media, client/device, confidence, plain-language explanation) with
  click-to-expand evidence. Backed by a new admin-only API endpoint (GET Sentinel/diagnoses).
  No incident dedup, no notifications yet. Verified by code inspection, two independent review
  rounds, and a clean local build/test run; not yet independently confirmed against a real
  server for this specific feature.
  0.1.1.0: Fix for a confirmed bug in 0.1.0.0 — real Jellyfin 12.1 install testing showed the
  plugin gets disabled with status "Malfunctioned", because Jellyfin's plugin loader tried to
  load the native Windows SQLite library as a managed .NET assembly (BadImageFormatException)
  and provides no automatic native-library resolution on any platform. The Windows library now
  ships as e_sqlite3.dll.win, and Plugin.cs registers a manual native-library resolver for all
  platforms. Confirmed loading and running correctly on a real Jellyfin 12.1 server.
  0.1.0.0: Initial foundation: playback observation, rule engine, SQLite persistence.
  Confirmed broken on a real Jellyfin 12.1 server — see 0.1.1.0.
